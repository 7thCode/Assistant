name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # skip postinstall: it pulls a multi-GB GGUF model that the packaged app
      # does not bundle anyway (users download models separately at runtime)
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and package
        run: npm run build

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.{dmg,zip,exe,AppImage,deb,snap,tar.gz}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
